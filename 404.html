<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Eden Tree Ltd.</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to Eden Tree's homepage.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234a8c1a'/><text y='70' x='50' text-anchor='middle' font-size='60' fill='white'>🌿</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: var(--cream);
    }
    .error-code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(100px, 20vw, 180px);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--green-400), var(--green-700));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    .error-title {
      font-size: clamp(24px, 4vw, 36px);
      color: var(--gray-900);
      margin-bottom: 16px;
    }
    .error-desc {
      font-size: 17px;
      color: var(--gray-500);
      max-width: 420px;
      margin: 0 auto 36px;
      line-height: 1.7;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary btn-lg">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Home
        </a>
        <a href="shop.html" class="btn btn-secondary btn-lg">Browse Shop</a>
      </div>
    </div>
  </div>
</body>
</html>
